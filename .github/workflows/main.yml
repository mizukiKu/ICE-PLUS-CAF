name: RezzzFy Project

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: KernelSu Next setup
        run: |
          # Download and execute the KernelSU Next setup script.
          # This script typically prepares the kernel source for KernelSU integration.
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -
          
      - name: Set up MemKernel as a module (M-OUT) with specified name
        # --- PERBAIKAN DI BAWAH INI ---
        # 'run:' harus di-indentasi (diberi spasi) agar sejajar dengan 'name:'
        # yang ada di atasnya, tetapi tanpa tanda '-'.
        run: |
          curl -LSs "https://raw.githubusercontent.com/anko5/MemKernel/refs/heads/main/kernel/setup.sh" | bash -s Y
          
      - name: SUKI setup
        run: |
          # Download and execute the SUKI setup script.
          # This is likely for integrating SUKI features into the kernel.
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s nongki

      - name: Android kernel build
        # --- SARAN PERBAIKAN (BEST PRACTICE) ---
        # Mengganti '@master' dengan '@v1' agar build lebih stabil
        uses: lemniskett/android-kernel-actions@v4
        id: build
        env:
          NAME: RezzzFy
        with:
          arch: arm64
          compiler: gcc/12
          defconfig: ice-whyred-oldcam_defconfig
          image: Image.gz-dtb

      - name: Upload Built Kernel
        uses: actions/upload-artifact@v4
        with:
          name: built-kernel
          path: |
            # Path ini sudah benar, tidak perlu diubah.
            ${{ steps.build.outputs.outfile }}
